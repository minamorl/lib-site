# lib.minamorl.com — TLS front for the kyanite tenant on THIS server.
#
# Why 443 is terminated here, outside kyanite:
#   kyanite's router only ever publishes `listen 80;` server blocks
#   (/var/lib/kyanite/nginx/*.conf, server_name = app name) and knows
#   nothing about certificates. Cloudflare reaches the origin on 443 only,
#   so something has to own the TLS hop. This block does: it terminates
#   with the *.minamorl.com wildcard cert and hands the request to the
#   kyanite-published :80 block on loopback with the Host header intact,
#   so nginx picks the kyanite server block by name and proxies on to the
#   live container port. Blue-green switches happen entirely inside the
#   kyanite block; this file never changes per deploy.
#
# Deliberately NO `listen 80` here: kyanite's own block is the :80 owner
# for this server_name, and a second one would be a duplicate.
#
# Installed by deploy/vultr-bootstrap.sh to
#   /etc/nginx/sites-available/lib.minamorl.com (+ sites-enabled symlink).
# ssl_* settings are copied from sites-available/canvas.minamorl.com.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name lib.minamorl.com;

    ssl_certificate     /etc/letsencrypt/live/minamorl.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/minamorl.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE+AESGCM:ECDHE+CHACHA20:!aNULL:!MD5;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    location / {
        # Loopback hop into the kyanite-published `listen 80` block. Host is
        # preserved so nginx selects the block whose server_name is
        # lib.minamorl.com rather than any default :80 server.
        proxy_pass http://127.0.0.1:80;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
