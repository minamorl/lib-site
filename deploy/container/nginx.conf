# nginx server block inside the lib.minamorl.com container.
# Installed by the Dockerfile as /etc/nginx/conf.d/default.conf; the base
# image's nginx.conf (worker/temp paths for uid 101, mime types) includes it.
#
# The container sits behind two nginx hops on vultr (front 443 vhost →
# kyanite's :80 block → 127.0.0.1:<published port>), so nothing here may
# depend on the request's scheme or the host's port: X-Forwarded-Proto
# arrives as "http" and the listen port is never the public one.

server {
    # nginx-unprivileged cannot bind :80; kyanite publishes exactly this port
    # ([process] port and [health] port in kyanite.toml).
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Astro builds with trailingSlash: "always" + format: "directory", so
    # /darkcore is a directory and nginx answers with a redirect to
    # /darkcore/. Keep that Location header relative (no scheme, no host,
    # no port) so the redirect survives the proxy hops unchanged.
    port_in_redirect off;
    absolute_redirect off;

    # Compress the text assets Astro emits; images are already compressed.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # kyanite's HTTP health probe (host side). Constant body, no log noise.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Astro's hashed build assets: the file name changes with the content,
    # so the content at a given URL never changes.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Pages: revalidate every time (Cloudflare and browsers), 404 → Astro's
    # own 404 page.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;
}
