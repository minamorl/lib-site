<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" class="lib-figure checkout-trace" role="img" aria-labelledby="stage-title stage-description">
  <title id="stage-title">A checkout splits, rejoins, fails, and recovers its partial state.</title>
  <desc id="stage-description">Validation succeeds. Reserve stock and score risk run concurrently from one snapshot. Their updates merge before charge declines. The application-written release handler sees 2 reserved units at tokyo-2, resets the reservation and returns Err. Notify is skipped.</desc>
  <defs>
    <pattern id="stage-grid" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="var(--sl-color-gray-4)" opacity="0.3" /></pattern>
    <linearGradient id="stage-wash" x1="0" y1="0" x2="1" y2="1"><stop stop-color="var(--sl-color-accent-low)" stop-opacity="0.7"/><stop offset="1" stop-color="var(--sl-color-black)" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="480" height="300" rx="12" fill="url(#stage-wash)"/>
  <rect width="480" height="300" rx="12" fill="url(#stage-grid)"/>
  <g fill="none" stroke-width="1.5">
    <path d="M36 92 H76 M76 92 C94 92 90 52 112 52 H130 M76 92 C94 92 90 132 112 132 H130 M244 52 H262 C284 52 278 92 300 92 M244 132 H262 C284 132 278 92 300 92 H332" stroke="var(--sl-color-accent)" class="trace-fork"/>
    <path d="M394 116 V192 H280" stroke="var(--sl-color-accent)" class="trace-recover"/>
    <path d="M168 214 V250 H112" stroke="var(--sl-color-gray-4)" stroke-dasharray="4 5"/>
  </g>
  <g fill="var(--sl-color-black)" stroke="var(--sl-color-accent)">
    <circle cx="36" cy="92" r="8"/><circle cx="300" cy="92" r="5"/>
    <rect x="130" y="30" width="114" height="44" rx="6"/><rect x="130" y="110" width="114" height="44" rx="6"/>
    <rect x="332" y="68" width="124" height="48" rx="6" class="trace-charge"/>
    <rect x="114" y="170" width="166" height="44" rx="6" class="trace-release"/>
  </g>
  <g font-family="var(--__sl-font-mono), monospace" fill="var(--sl-color-white)" font-size="15" text-anchor="middle">
    <text x="187" y="57">reserve</text><text x="187" y="137">score_risk</text><text x="394" y="97">charge ×</text><text x="197" y="197">release ↶</text>
  </g>
  <g font-family="var(--__sl-font-mono), monospace" fill="var(--sl-color-gray-2)" font-size="11">
    <text x="15" y="72">validate</text><text x="154" y="20">2 units held</text><text x="145" y="166">risk = 0.12</text>
    <text x="282" y="74">join</text><text x="353" y="137" fill="var(--sl-color-accent-high)">DECLINED</text>
    <text x="303" y="183">partial state</text><text x="139" y="234" fill="var(--sl-color-accent-high)">0 units held · Err</text>
    <text x="25" y="255">notify</text><text x="24" y="272">skipped</text>
  </g>
  <path d="M93 244 L103 254 M103 244 L93 254" stroke="var(--sl-color-gray-3)" stroke-width="1.5" />
</svg>
